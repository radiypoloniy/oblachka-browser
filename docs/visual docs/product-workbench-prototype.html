  function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),2500)}
  function sourceDoc(id){const p=pages[id]||pages.architecture;return `<article class="page-pad doc"><div class="site-domain">${p.host} / статья</div><h1>${p.title}</h1><p class="lead">${p.description}</p><div class="source-actions"><button class="primary" data-action="capture-quote" data-id="${id}">✦ Сохранить цитату с URL</button><button class="secondary" data-action="copy-markdown" data-id="${id}">Скопировать Markdown</button></div><p>${p.body}</p><div class="quote-block">«<mark>${p.quote}</mark>»</div><p>Цитата остаётся рядом с полным текстом. После сохранения она появляется в материалах задачи и доступна для экспорта.</p></article>`}
  function results(){return `<div class="page-pad"><div class="site-domain">ПОИСК / рабочая задача</div><h1 class="web-h1">Источники для статьи</h1><p class="web-intro">Найдите материал, быстро проверьте его и оставьте рядом с черновиком только то, что пригодится.</p><div class="searchbar">⌕ &nbsp; удобство работы в браузере</div>${['architecture','research'].map(id=>{const p=pages[id];return `<div class="result"><div class="host">${p.host}</div><h3>${p.title}</h3><p>${p.description}</p><button data-action="peek" data-id="${id}">Предпросмотр ↗</button></div>`}).join('')}</div>`}
  function gallery(){return `<div class="page-pad"><div class="site-domain">РЕФЕРЕНСЫ / источники</div><h1 class="web-h1">Найти и отобрать визуальный язык</h1><p class="web-intro">Кликните «Сохранить» на изображении — оно попадёт в материалы задачи вместе с источником. Страницу можно открыть рядом с брифом.</p><button class="secondary" data-action="peek" data-id="reference">Предпросмотр страницы ↗</button><div class="image-grid">${['Редакционная сетка','Типографика','Мягкий свет','Контентные блоки'].map((name,i)=>`<div class="image-card"><div class="art"></div><div class="image-meta"><b>${name}</b><small>studio.example · ${i+1} из 4</small><button data-action="capture-image" data-id="${i}">+ Сохранить с URL</button></div></div>`).join('')}</div></div>`}
  function devViewport(width,right=false){return `<div class="devpage" ${right?'style="height:calc(100% - 90px)"':''}><div class="dev-toolbar"><span>localhost:5173 / dashboard</span><span>${width} px ${right?'· мобильный':'· десктоп'}</span></div><div class="dev-viewport" style="width:min(100%,${right?'var(--dev-width)':'100%'})" ${right?'id="mobile-viewport"':''}><div class="demo-nav">Northstar &nbsp; · &nbsp; Dashboard</div><div class="demo-content"><h2>Главная панель</h2><p>Проверьте один интерфейс на разных ширинах.</p><div class="demo-banner"></div><div class="demo-card">Активность за неделю · график</div><div class="demo-card">Карточка проекта · действия</div><button class="demo-btn" data-action="dev-click">Открыть меню</button><div style="height:280px"></div><div class="demo-card">Нижний блок страницы для проверки прокрутки</div></div></div></div>`}
  function draft(){return `<div class="draft"><div class="draft-header">РАБОЧИЙ ДОКУМЕНТ · сохранён в задаче</div><h1>${state.mode==='creator'?'Бриф: обновление интерфейса':'Черновик статьи'}</h1><textarea id="draft-text" aria-label="Черновик">${esc(state.draftTexts[state.mode])}</textarea></div>`}
  function render(){const c=configs[state.mode];$('task-title').textContent=c.task;$('side-home').textContent=c.home;$('side-draft').textContent=c.draft;$('address-label').textContent=c.address;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));$('material-count').textContent=state.materials.length;document.querySelector('.pane.left').style.order=state.swapped?2:1;document.querySelector('.pane.right').style.order=state.swapped?1:2;
    $('materials').innerHTML=state.materials.length?state.materials.map(m=>`<div class="material"><span class="kind">${m.kind}</span><strong>${esc(m.title)}</strong><small>${esc(m.url)}</small></div>`).join(''):'<div style="padding:9px;color:#a1afb0;font-size:11px">Пока пусто. Сохраните цитату или изображение.</div>';
    $('source-indicator').textContent=state.source?'1':'пусто';$('left-title').textContent=c.home;$('left-icon').textContent=state.mode==='developer'?'⌘':state.mode==='creator'?'◇':'⌕';$('left-content').innerHTML=state.mode==='research'?results():state.mode==='creator'?gallery():devViewport(1440);
    if(state.mode==='developer'){$('stack').innerHTML='<button class="stack-tab active">Мобильный</button><button class="stack-tab">Десктоп</button>';$('right-title').textContent='Тот же URL · мобильный';$('right-icon').textContent='▯';$('right-content').innerHTML=devViewport(state.devWidth,true)+`<div class="dev-controls" style="padding:8px 14px;background:#fff;border-top:1px solid #e2e8e8"><label>Ширина <input id="dev-width" type="range" min="320" max="600" value="${state.devWidth}"></label><span id="width-label">${state.devWidth} px</span><label><input id="sync-check" type="checkbox" ${state.sync?'checked':''}> Синхр. прокрутка</label><label>Профиль <select id="dev-profile"><option ${state.devProfile==='Рабочий'?'selected':''}>Рабочий</option><option ${state.devProfile==='Чистый'?'selected':''}>Чистый</option></select></label><button class="tiny" data-action="capture-bug">Снимок + условия</button></div>`;$('mobile-viewport').style.setProperty('--dev-width',state.devWidth+'px');const slider=$('dev-width');slider.addEventListener('input',()=>{state.devWidth=Number(slider.value);$('mobile-viewport').style.setProperty('--dev-width',state.devWidth+'px');$('width-label').textContent=state.devWidth+' px'});$('sync-check').addEventListener('change',e=>{state.sync=e.target.checked;toast(state.sync?'Прокрутка панелей связана':'Прокрутка панелей независима')});$('dev-profile').addEventListener('change',e=>{state.devProfile=e.target.value;toast('Профиль: '+state.devProfile)});const views=document.querySelectorAll('.dev-viewport');let mirroring=false;views.forEach((view,index)=>view.addEventListener('scroll',()=>{if(!state.sync||mirroring)return;mirroring=true;views[1-index].scrollTop=view.scrollTop;requestAnimationFrame(()=>{mirroring=false})}));return}
    $('stack').innerHTML=`<button class="stack-tab ${state.right==='draft'?'active':''}" data-action="draft">${c.draft}</button>${state.source?`<button class="stack-tab ${state.right==='source'?'active':''}" data-action="source">Источник · ${pages[state.source].host}</button>`:''}`;$('right-title').textContent=state.right==='source'&&state.source?pages[state.source].title:c.draft;$('right-icon').textContent=state.right==='source'?'▤':'✎';$('right-content').innerHTML=state.right==='source'&&state.source?sourceDoc(state.source):draft();if($('draft-text'))$('draft-text').addEventListener('input',e=>{state.draftTexts[state.mode]=e.target.value});
  }
  function openOverlay(type,id){state.overlay={type,id};const el=$('overlay');el.classList.remove('hidden');let html='';
    if(type==='peek'){const p=pages[id];html=`<div class="modal wide"><div class="modal-head"><div><small>ПРЕДПРОСМОТР · вкладка ещё не создана</small><h2>${p.title}</h2><p>${p.host}</p></div><button class="close" data-action="close">✕</button></div><div class="modal-body"><p>${p.description}</p><div class="quote-block">«${p.quote}»</div><p>${p.body}</p><div class="modal-actions"><button class="primary" data-action="promote" data-id="${id}">Открыть в правой половине →</button><button class="secondary" data-action="save-link" data-id="${id}">Сохранить ссылку в задачу</button><button class="secondary" data-action="close">Закрыть просмотр</button></div></div></div>`}
    if(type==='search'){const q=state.searchQuery.toLowerCase();const entries=[{kind:'Вкладка',title:configs[state.mode].home,url:'открыто сейчас',id:null},{kind:'Материал',title:state.materials[0]?.title||'Сохранённые цитаты и изображения',url:'текущая задача',id:null},{kind:'История',title:pages.architecture.title,url:pages.architecture.host,id:'architecture'},{kind:'Закладка',title:pages.research.title,url:pages.research.host,id:'research'}].filter(x=>(state.searchScope==='all'||x.kind.toLowerCase()===state.searchScope)&&(x.title.toLowerCase().includes(q)||x.url.toLowerCase().includes(q)));html=`<div class="modal search-modal"><div class="modal-head"><div><small>ПОИСК В РАБОЧЕМ КОНТЕКСТЕ</small><h2>Куда я это дел?</h2></div><button class="close" data-action="close">✕</button></div><div class="modal-body"><input id="search-input" aria-label="Поиск" placeholder="Название, текст, источник..." value="${esc(state.searchQuery)}"><div class="filters">${[['all','Всё'],['вкладка','Вкладки'],['материал','Материалы'],['история','История'],['закладка','Закладки']].map(([key,name])=>`<button class="${state.searchScope===key?'active':''}" data-action="scope" data-id="${key}">${name}</button>`).join('')}</div><div id="search-hits">${entries.map(x=>`<button class="search-hit" ${x.id?`data-action="peek" data-id="${x.id}"`:'data-action="close"'}><b>${x.title}</b><small>${x.kind} · ${x.url}</small></button>`).join('')||'<p style="color:#8b9a9b">Ничего не найдено в выбранной области.</p>'}</div></div></div>`}
    if(type==='pause'){html=`<div class="modal"><div class="modal-head"><div><small>ЗАДАЧА ПРИОСТАНОВЛЕНА</small><h2>${configs[state.mode].task}</h2><p>Окно освобождено. Состав split и ${state.materials.length} материалов ждут возвращения.</p></div></div><div class="modal-body"><div class="quote-block">Сохранено: ${configs[state.mode].home} · ${state.source?pages[state.source].title:'правая половина'} · ${configs[state.mode].draft} · ${state.materials.length} материалов</div><div class="modal-actions"><button class="primary" data-action="resume">↶ Вернуться к задаче</button><button class="secondary" data-action="export">Экспортировать материалы</button></div></div></div>`}
    if(type==='export'||type==='markdown'){const content=type==='markdown'?`> ${pages[id].quote}\n\nИсточник: [${pages[id].title}](https://${pages[id].host})`:`# ${configs[state.mode].task}\n\n${state.materials.map(m=>`- ${m.kind}: [${m.title}](${m.url})${m.quote?`\n  > ${m.quote}`:''}`).join('\n')||'- Материалы пока не сохранены'}\n\n## Рабочий контекст\n- ${configs[state.mode].home}\n- ${state.source?pages[state.source].title:configs[state.mode].draft}`;html=`<div class="modal"><div class="modal-head"><div><small>ПЕРЕДАТЬ РЕЗУЛЬТАТ</small><h2>${type==='markdown'?'Цитата в Markdown':'Экспорт задачи в Markdown'}</h2><p>Ссылки на источники остаются в тексте.</p></div><button class="close" data-action="close">✕</button></div><div class="modal-body"><textarea id="export-text" aria-label="Markdown для экспорта">${esc(content)}</textarea><div class="modal-actions"><button class="primary" data-action="copy-export">Скопировать Markdown</button><button class="secondary" data-action="close">Закрыть</button></div></div></div>`}
    if(type==='notebook'||type==='tool'){html=`<div class="modal"><div class="modal-head"><div><small>${type==='notebook'?'NOTEBOOK / ТЕКУЩАЯ ЗАДАЧА':'ПРИЛОЖЕНИЕ РЯДОМ'}</small><h2>${type==='notebook'?'Материалы задачи':'Инструменты для работы'}</h2></div><button class="close" data-action="close">✕</button></div><div class="modal-body">${type==='notebook'?`<p>Цитаты и изображения из рабочего окна доступны здесь без переключения хаба.</p>${state.materials.map(m=>`<div class="material"><span class="kind">${m.kind}</span><strong>${esc(m.title)}</strong><small>${esc(m.url)}</small></div>`).join('')||'<p>Пока нет сохранённых материалов.</p>'}`:'<p>Небольшая утилита открывается поверх текущей задачи. Например: таймер, переводчик или пользовательское веб-приложение.</p><div class="searchbar">◷ &nbsp; Таймер фокус-сессии &nbsp; 25:00</div>'}<div class="modal-actions"><button class="secondary" data-action="close">Вернуться к страницам</button></div></div></div>`}
    el.innerHTML=html;if(type==='search'){$('search-input').focus();$('search-input').addEventListener('input',e=>{state.searchQuery=e.target.value;openOverlay('search');$('search-input').focus();$('search-input').setSelectionRange(state.searchQuery.length,state.searchQuery.length)})}
  }
  function closeOverlay(){state.overlay=null;$('overlay').classList.add('hidden');$('overlay').innerHTML=''}
  function addMaterial(kind,title,url,quote){if(state.materials.some(m=>m.kind===kind&&m.title===title)){toast('Уже есть в материалах задачи');return}state.materials.unshift({kind,title,url,quote});render();toast('Сохранено в материалах задачи')}
  document.addEventListener('click',async event=>{const b=event.target.closest('[data-mode],[data-action]');if(!b)return;if(b.dataset.mode){state.mode=b.dataset.mode;state.source=null;state.right='draft';state.swapped=false;state.materials=[];closeOverlay();render();return}const action=b.dataset.action,id=b.dataset.id;
    if(action==='peek')openOverlay('peek',id);
    else if(action==='close'||action==='resume')closeOverlay();
    else if(action==='promote'){state.source=id;state.right='source';closeOverlay();render();toast('Источник открыт справа; черновик остался в стопке')}
    else if(action==='save-link'){addMaterial('Ссылка',pages[id].title,'https://'+pages[id].host);closeOverlay()}
    else if(action==='capture-quote')addMaterial('Цитата',pages[id].title,'https://'+pages[id].host,pages[id].quote);
    else if(action==='capture-image')addMaterial('Изображение',['Редакционная сетка','Типографика','Мягкий свет','Контентные блоки'][Number(id)],'https://studio.example');
    else if(action==='capture-bug')addMaterial('Баг + снимок',`localhost:5173 · ${state.devWidth}px · ${state.devProfile}`,'http://localhost:5173/dashboard');
    else if(action==='draft'){state.right='draft';render()}
    else if(action==='source'){if(state.source){state.right='source';render()}else toast('Сначала откройте источник из предпросмотра')}
    else if(action==='home'){$('left-content').scrollTop=0;toast('Рабочая страница уже открыта слева')}
    else if(action==='swap'){state.swapped=!state.swapped;render();toast('Стороны поменялись местами')}
    else if(action==='search')openOverlay('search');
    else if(action==='scope'){state.searchScope=id;openOverlay('search')}
    else if(action==='pause')openOverlay('pause');
    else if(action==='export')openOverlay('export');
    else if(action==='copy-markdown')openOverlay('markdown',id);
    else if(action==='copy-export'){const content=$('export-text').value;try{await navigator.clipboard.writeText(content);toast('Markdown скопирован')}catch{$('export-text').select();toast('Текст выделен — нажмите Ctrl+C')}}
    else if(action==='notebook'||action==='tool')openOverlay(action);
    else if(action==='dev-click'){document.querySelectorAll('.demo-content').forEach(container=>{const old=container.querySelector('.demo-open-menu');if(old)old.remove();else{const menu=document.createElement('div');menu.className='demo-card demo-open-menu';menu.textContent='Меню проекта · Настройки · Выход';container.querySelector('.demo-btn').after(menu)}})}
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openOverlay('search')}});
  $('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeOverlay()});
  render();
</script>
</body>
</html>
