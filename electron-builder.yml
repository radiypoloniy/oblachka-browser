# Упаковка Windows-установщика (electron-builder). Отдельным файлом, а не блоком в
# package.json — конфиг объёмный и требует комментариев, которые JSON не позволяет.

# ВНИМАНИЕ: appId менять нельзя после первого релиза — Windows считает приложение с другим
# appId ДРУГОЙ программой: обновление встанет второй копией рядом, а не поверх.
appId: com.oblako.browser
# productName задаёт имя .exe, папки установки и ярлыка. НЕ влияет на app.getName(), который
# читает поле name из package.json (oblako-browser) — а значит и на app.getPath('userData').
# Это намеренно: профиль пользователя (пароли, история, сессия) остаётся по прежнему пути и
# смена витринного имени не «теряет» его данные. Не добавлять productName в package.json.
productName: Oblako
copyright: Oblako

directories:
  output: release
  buildResources: build

# node_modules боевых зависимостей electron-builder добавляет сам, перечислять не нужно —
# здесь только собственные артефакты сборки плюс точечные исключения.
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  # Бэкенды node-llama-cpp под чужое железо — мёртвый вес в сборке под win-x64.
  # win-arm64: цель — x64, эта сборка не запустится в принципе (21 МБ).
  - '!**/node_modules/@node-llama-cpp/win-arm64/**'
  # win-x64-cuda-ext: 361 МБ ради одного ggml-cuda.dll в папке fallback/. Грузится только если
  # основной CUDA-бэкенд не увидел GPU (см. node-llama-cpp/dist/bindings/Llama.js — loadBackends
  # с fallbackBackendsDir). Для таких редких карт остаётся Vulkan, он работает и на NVIDIA.
  - '!**/node_modules/@node-llama-cpp/win-x64-cuda-ext/**'
  # cmake-js — тулчейн сборки нативных биндингов, в рантайме не используется: node-llama-cpp
  # упоминает его только как имя npm-скрипта (`npm run -s cmake-js-llama` в compileLLamaCpp.js),
  # то есть при компиляции llama.cpp из исходников — чего в упакованном приложении не бывает.
  # Заодно из сборки уходит его зависимость tar (3.4 МБ вместе), у которой открыт ворох
  # DoS-уязвимостей: недостижимый код лучше не поставлять вовсе.
  - '!**/node_modules/cmake-js/**'
  # pdfjs-dist (узел-файл графа, см. electron/FileExtract.ts) весит 35 МБ на диске, а в
  # рантайме нужны только legacy/build/pdf.mjs с воркером и standard_fonts/ (метрики
  # стандартных шрифтов — без них часть PDF теряет текст). Остальное — мёртвый вес:
  - '!**/node_modules/pdfjs-dist/**/*.map'        # сорсмапы, примерно половина объёма
  - '!**/node_modules/pdfjs-dist/web/**'          # готовый вьюер PDF с интерфейсом
  - '!**/node_modules/pdfjs-dist/build/**'        # не-legacy сборка, мы грузим legacy
  - '!**/node_modules/pdfjs-dist/image_decoders/**' # картинки не извлекаем
  - '!**/node_modules/pdfjs-dist/types/**'        # .d.ts нужны только при компиляции
  # Только git-бандл исходников llama.cpp (32 МБ) — он нужен исключительно для локальной
  # пересборки биндингов. Всю папку llama/ исключать НЕЛЬЗЯ: рядом лежат крошечные, но
  # обязательные в рантайме binariesGithubRelease.json и grammars/ (~380 КБ на всё) —
  # без них node-llama-cpp падает с ENOENT ещё до загрузки модели.
  - '!**/node_modules/node-llama-cpp/llama/gitRelease.bundle'

# Нативный код обязан лежать распакованным: .node и .dll нельзя загрузить из asar-архива.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/node-llama-cpp/**'
  - '**/node_modules/@node-llama-cpp/**'

# Кладётся в resources/ рядом с app.asar — ровно туда, куда смотрит код при app.isPackaged
# (VpnProcess.ts:66 → resourcesPath/xray/xray.exe, main.ts:258 → resourcesPath/models/translation).
extraResources:
  # Логотип для окна-заставки: она рисуется ДО главного окна и не может тянуть ассеты из
  # бандла рендерера, поэтому файл нужен на диске рядом с приложением.
  # ⚠️ Берём ТОТ ЖЕ build/icon.png, что и значок приложения, а не свою копию в resources/brand.
  # Копия там и лежала — и протухла: `npm run make-icon` пересобирает только build/icon.png, а
  # resources/brand/icon.png когда-то скопировали руками. Полтора месяца установленный браузер
  # показывал на заставке ПРОШЛЫЙ логотип, хотя значок и `npm start` были уже с новым (в разработке
  # заставка падает на третьего кандидата — build/icon.png, см. SplashWindow.ts::logoDataUrl).
  # Один файл — один источник правды: разъехаться больше нечему.
  - from: build/icon.png
    to: brand/icon.png
  - from: resources/xray
    to: xray
  # Bergamot: только ru↔en (44 МБ). Все 41 пара — это +1.3 ГБ в установщике, при том что
  # рантайм-докачки пар пока нет (есть лишь build-time scripts/download-translation-models.mjs).
  # Для остальных языков движок отдаёт isReady()===false и перевод тихо уходит на Qwen —
  # медленнее, но рабочий путь (см. warmupBergamot в main.ts). Расширять список — здесь.
  - from: resources/models/translation/ru-en
    to: models/translation/ru-en
  - from: resources/models/translation/en-ru
    to: models/translation/en-ru
# GGUF-модели (resources/models/gguf, 6.3 ГБ) в установщик НЕ кладутся сознательно: они
# качаются пользователем из UI в userData (ModelDownloader.ts/ModelRegistry.ts).

# better-sqlite3 уже пересобран под ABI Electron через electron-rebuild (postinstall в
# package.json). Повторная пересборка силами electron-builder только добавляет шанс уронить
# рабочий модуль на машине без C++ tools — а результат тот же самый.
npmRebuild: false

# Fuses — только упакованный exe (`npm run dist` / `release`). `npm start` и `npm run dev`
# их не видят: это правка бинарника Electron в extraResources/win-unpacked, не рантайма из
# node_modules. Три выключателя из аудита 20.08: иначе локальный процесс запускает наш
# (потом подписанный) бинарник как Node и исполняет свой код от нашего имени.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    # Версия без установки: распаковал и запустил Oblako.exe. Именно zip, а не portable-exe —
    # portable каждый раз распаковывает ~700 МБ бинарников AI во временную папку перед стартом,
    # то есть платит минуту ожидания на КАЖДЫЙ запуск. Zip платит один раз.
    # ⚠️ Профиль при этом всё равно ложится в %APPDATA%\oblako-browser (app.getPath('userData')),
    # а не рядом с exe: «без установки» здесь про отсутствие инсталлятора, не про переносимость
    # между машинами вместе с данными.
    - target: zip
      arch:
        - x64

# Без пробелов в имени артефакта. По умолчанию получается «Oblako Setup 0.1.0.exe», но в
# latest.yml (фид апдейтера) electron-builder пишет уже URL-безопасный вариант через дефисы —
# потому что GitHub переименовывает файлы с пробелами при загрузке в релиз. Две разные строки
# для одного файла — готовый источник «обновление не скачивается»; фиксируем имя явно.
artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  # Регистрация браузера в реестре Windows (RegisteredApplications/Capabilities). Без неё
  # Oblako не появляется в системном списке «Приложения по умолчанию», и назначить его
  # браузером нельзя в принципе — см. build/installer.nsh и electron/DefaultBrowser.ts.
  # Лицо установки — не MUI, а oblako-setup-ui.exe: customInit прячет мастер (SetSilent)
  # и показывает карточку. Сборка лица: npm run build-installer-ui, до electron-builder.
  include: build/installer.nsh
  # Картинки MUI остаются для деинсталлятора и запасного пути, если UI-exe не поднялся.
  # Размеры (164×314 и 150×57) задаёт сам MUI; BMP 24 бита — требование контрола Windows.
  installerSidebar: build/installer-sidebar.bmp
  uninstallerSidebar: build/installer-sidebar.bmp
  installerHeader: build/installer-header.bmp
  # Установка в профиль пользователя, без прав администратора. Это принципиально для
  # автообновления: perMachine потребовал бы UAC-подтверждения на КАЖДОЕ обновление.
  perMachine: false
  # oneClick: без «Далее» и выбора папки. Карточка — единственный экран для человека.
  oneClick: true
  allowToChangeInstallationDirectory: false
  # Приложение после первой установки открывает карточка («Открыть Oblako»). Апдейтер
  # передаёт --force-run и поднимает браузер сам, карточку на --updated не показывает.
  runAfterFinish: false
  # Блок-карта для дифференциальных обновлений: следующая версия качает только изменившиеся
  # блоки, а не весь установщик целиком. При ~600 МБ бинарников AI это разница между
  # «обновление на 10 МБ» и «обновление на полгигабайта».
  differentialPackage: true

publish:
  provider: github
  owner: radiypoloniy
  repo: oblachka-browser
