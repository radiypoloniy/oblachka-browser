<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Oblako — поиск на странице</title>
  <style>
    /* !important — global.css грузится позже этого инлайн-стиля и иначе перебивает прозрачность,
       давая непрозрачный прямоугольник вокруг панели поверх страницы. */
    html, body, #root { margin: 0; padding: 0; background: transparent !important; overflow: hidden; }
    #root { display: inline-block; }
    .findbar-btn {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; flex-shrink: 0;
      background: none; border: none; border-radius: 8px;
      color: var(--text-muted); cursor: default; padding: 0;
    }
    .findbar-btn:hover:not(:disabled) { background: var(--surface-sunken); color: var(--text-strong); }
    .findbar-btn:disabled { opacity: 0.4; color: var(--text-faint); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./findbar.tsx"></script>
</body>
</html>
