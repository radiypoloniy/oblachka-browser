<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Oblako — запрос разрешения</title>
  <style>

    #root { display: inline-block; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./permissionpopover.tsx"></script>
</body>
</html>
