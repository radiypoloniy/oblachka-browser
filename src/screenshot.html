<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Oblako — снимок вкладки</title>
  <style>
    /* !important — global.css грузится позже этого инлайн-стиля и иначе перебивает прозрачность,
       давая непрозрачный прямоугольник вокруг карточки поверх страницы. */
    html, body, #root {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent !important; overflow: hidden;
      user-select: none; -webkit-user-select: none;
    }
    #root { display: block; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./screenshot.tsx"></script>
</body>
</html>
