<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Oblako — перевод</title>
  <style>
    /* !important — global.css (общие токены/канвас чрома) грузится позже этого инлайн-стиля и
       иначе перебивает прозрачность (html/body/#root { background: var(--app-bg/--canvas) }),
       давая непрозрачный прямоугольник вокруг карточки поверх страницы. */
    html, body, #root { margin: 0; padding: 0; background: transparent !important; overflow: hidden; }
    #root { display: inline-block; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./translatepopover.tsx"></script>
</body>
</html>
