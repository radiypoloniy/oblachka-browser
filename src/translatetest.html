<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Oblako — translatetest</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; max-width: 720px; }
    textarea { width: 100%; height: 90px; font-size: 15px; box-sizing: border-box; }
    select, button { font-size: 14px; margin-top: 8px; }
    button { padding: 6px 16px; cursor: pointer; }
    #output { white-space: pre-wrap; border: 1px solid #ccc; border-radius: 6px; padding: 12px; margin-top: 12px; min-height: 60px; }
    #status { color: #666; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <h3>Oblako — тест перевода (EuroLLM-1.7B, node-llama-cpp)</h3>
  <textarea id="input" placeholder="Введи фразу на русском или английском… (Ctrl+Enter — перевести)"></textarea>
  <div>
    <select id="dir">
      <option value="auto">Авто (по кириллице)</option>
      <option value="ru->en">ru → en</option>
      <option value="en->ru">en → ru</option>
    </select>
    <button id="go">Перевести</button>
  </div>
  <div id="output"></div>
  <div id="status"></div>
  <script type="module" src="./translatetest.ts"></script>
</body>
</html>
